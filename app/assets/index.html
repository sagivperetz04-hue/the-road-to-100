<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#EEF3FF">
  <script>
    /* set the theme before the first paint (theme.js takes over once loaded) */
    (function () {
      var t = "auto";
      try { t = (JSON.parse(localStorage.getItem("stairs.v1") || "{}").settings || {}).theme || "auto"; } catch (e) {}
      if (t === "auto") {
        var night = false;
        try { night = window.AndroidBridge && AndroidBridge.isNightMode ? AndroidBridge.isNightMode() : matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) {}
        t = night ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <style>
    /* loading screen: painted at once, before app.css and the scripts; removed by app.js (finishLoading) */
    #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(90% 60% at 50% 42%, #FFFFFF 0%, #EEF3FF 70%); color: #1C1F3A; font-family: system-ui, sans-serif; transition: opacity .35s ease, transform .35s ease; }
    html[data-theme="dark"] #splash { background: radial-gradient(90% 60% at 50% 42%, #2A2F6A 0%, #0E1130 70%); color: #F2F0FF; }
    html[data-theme="pink"] #splash { background: radial-gradient(90% 60% at 50% 42%, #FFFFFF 0%, #FFE3F1 70%); color: #5A1240; }
    /* gallery: keep in sync with MAT.gallery (scene.js) and PALETTES.gallery (art.js) */
    html[data-theme="gallery"] #splash { background: #FFFFFF; color: #1D1D1F; }
    html[data-theme="gallery"] #splash .sky0, html[data-theme="gallery"] #splash .sky1 { stop-color: #FFFFFF; }
    html[data-theme="gallery"] #splash .spt-front { fill: #F5F5F7; stroke: #D6D6D6; } html[data-theme="gallery"] #splash .spt-top { fill: #FFFFFF; stroke: #D6D6D6; } html[data-theme="gallery"] #splash .spt-side { fill: #E6E6E8; stroke: #D6D6D6; }
    html[data-theme="gallery"] #splash .sp-card { box-shadow: 0 0 0 1px #E6E6E8; border-radius: 28px; }
    html[data-theme="gallery"] #splash .sp-sun, html[data-theme="gallery"] #splash .sp-cloud, html[data-theme="gallery"] #splash .sp-mtn { display: none; }
    html[data-theme="gallery"] #splash .sp-mtn { fill: #EDEDF0; } html[data-theme="gallery"] #splash .sp-grass { fill: #FFFFFF; } html[data-theme="gallery"] #splash .sp-grass-top { fill: #D6D6D6; height: 1px; }
    #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
    #splash .sp-card { width: min(72vw, 300px); border-radius: 26px; overflow: hidden; box-shadow: 0 18px 40px -16px rgba(40, 30, 120, .45), 0 4px 0 rgba(40, 30, 120, .12); animation: sp-in .6s cubic-bezier(.2, .9, .25, 1.05) both; }
    #splash .sp-card svg { display: block; width: 100%; height: auto; }
    #splash h1 { margin: 8px 0 0; font-size: 30px; font-weight: 900; letter-spacing: -.5px; animation: sp-in .6s .08s cubic-bezier(.2, .9, .25, 1.05) both; }
    #splash .sp-sub { margin: -8px 0 0; font-size: 15px; font-weight: 700; opacity: .7; }
    #splash .sp-bar { position: relative; width: min(52vw, 210px); height: 8px; border-radius: 4px; overflow: hidden; background: rgba(120, 90, 220, .18); }
    #splash .sp-bar i { position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 4px; background: linear-gradient(90deg, #FF5FB0, #9B5CF6); animation: sp-bar 1.1s ease-in-out infinite; }
    #splash .sp-cap { font-size: 13px; font-weight: 700; opacity: .6; }
    #splash .sp-hero { animation: sp-climb 3.6s ease-in-out infinite; transform: translate(185px, 144px); }
    #splash .sp-sun { animation: sp-glow 2.4s ease-in-out infinite; transform-origin: 196px 30px; }
    #splash .sp-cloud { animation: sp-drift 6s ease-in-out infinite alternate; }
    #splash .sp-crown { animation: sp-crown 1.8s ease-in-out infinite; transform-origin: 35px 58px; }
    html[data-theme="dark"] #splash .sky0 { stop-color: #1B2263; } html[data-theme="dark"] #splash .sky1 { stop-color: #4A3290; }
    html[data-theme="pink"] #splash .sky0 { stop-color: #FFB8DD; } html[data-theme="pink"] #splash .sky1 { stop-color: #FFF0F8; }
    #splash .spt-front { fill: #EBD7AE; stroke: #CBB282; stroke-width: .5; } #splash .spt-top { fill: #FFF2D2; stroke: #CBB282; stroke-width: .5; } #splash .spt-side { fill: #BA9969; stroke: #CBB282; stroke-width: .5; } #splash .spt-bevel { stroke: #FFF9E9; stroke-width: 1; opacity: .8; fill: none; }
    html[data-theme="pink"] #splash .spt-front { fill: #F5BEDF; stroke: #CD8EB7; } html[data-theme="pink"] #splash .spt-top { fill: #FFF6FC; stroke: #CD8EB7; } html[data-theme="pink"] #splash .spt-side { fill: #BC72A5; stroke: #CD8EB7; }
    html[data-theme="dark"] #splash .spt-front { fill: #65729A; stroke: #485478; } html[data-theme="dark"] #splash .spt-top { fill: #A9B3D7; stroke: #485478; } html[data-theme="dark"] #splash .spt-side { fill: #343E62; stroke: #485478; } html[data-theme="dark"] #splash .spt-bevel { stroke: #D3DFFF; }
    @keyframes sp-in { from { transform: translateY(16px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes sp-bar { 0% { left: -40%; } 100% { left: 100%; } }
    @keyframes sp-glow { 50% { transform: scale(1.12); } }
    @keyframes sp-drift { to { transform: translateX(14px); } }
    @keyframes sp-crown { 50% { transform: translateY(-4px) rotate(-6deg); } }
    @keyframes sp-climb { 0.00% { transform: translate(185px, 144px) scale(1, 1); } 2.52% { transform: translate(185px, 144px) scale(1.12, .86); } 5.88% { transform: translate(170.0px, 110px) scale(.92, 1.1); } 8.68% { transform: translate(155px, 128px) scale(1.12, .86); } 14.00% { transform: translate(155px, 128px) scale(1, 1); } 16.52% { transform: translate(155px, 128px) scale(1.12, .86); } 19.88% { transform: translate(140.0px, 94px) scale(.92, 1.1); } 22.68% { transform: translate(125px, 112px) scale(1.12, .86); } 28.00% { transform: translate(125px, 112px) scale(1, 1); } 30.52% { transform: translate(125px, 112px) scale(1.12, .86); } 33.88% { transform: translate(110.0px, 78px) scale(.92, 1.1); } 36.68% { transform: translate(95px, 96px) scale(1.12, .86); } 42.00% { transform: translate(95px, 96px) scale(1, 1); } 44.52% { transform: translate(95px, 96px) scale(1.12, .86); } 47.88% { transform: translate(80.0px, 62px) scale(.92, 1.1); } 50.68% { transform: translate(65px, 80px) scale(1.12, .86); } 56.00% { transform: translate(65px, 80px) scale(1, 1); } 58.52% { transform: translate(65px, 80px) scale(1.12, .86); } 61.88% { transform: translate(50.0px, 46px) scale(.92, 1.1); } 64.68% { transform: translate(35px, 64px) scale(1.12, .86); } 70.00% { transform: translate(35px, 64px) scale(1, 1); } 88% { transform: translate(35px, 54px) scale(1.05, 1.05); opacity: 1; } 96% { transform: translate(35px, 64px); opacity: 1; } 99% { transform: translate(35px, 64px); opacity: 0; } 100% { transform: translate(185px, 144px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation: none !important; } #splash .sp-hero { transform: translate(35px, 64px); } }
  </style>
  <title>The Road To 100</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="splash" role="status" aria-label="טוען">
    <div class="sp-card">
      <svg viewBox="0 0 240 180" aria-hidden="true">
        <defs>
          <linearGradient id="spSky" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop class="sky0" offset="0" stop-color="#8FD3FF"/><stop class="sky1" offset="1" stop-color="#E4EEFF"/></linearGradient>
          <linearGradient id="spStep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8DDB0"/><stop offset="1" stop-color="#E9BF84"/></linearGradient>
          <radialGradient id="spBody" cx=".32" cy=".22" r=".82"><stop offset="0" stop-color="#E1B7FF"/><stop offset=".52" stop-color="#AC60E2"/><stop offset="1" stop-color="#713AA7"/></radialGradient>
        </defs>
        <rect y="-260" width="240" height="440" fill="url(#spSky)"/>
        <g class="sp-sun"><circle cx="196" cy="30" r="20" fill="#FFE27A" opacity=".35"/><circle cx="196" cy="30" r="13" fill="#FFD84D"/></g>
        <g class="sp-cloud" fill="#fff" opacity=".95"><ellipse cx="70" cy="30" rx="16" ry="8"/><ellipse cx="82" cy="25" rx="11" ry="9"/><ellipse cx="150" cy="44" rx="12" ry="6"/><ellipse cx="159" cy="40" rx="8" ry="7"/></g>
        <path class="sp-mtn" d="M0 160 L60 104 L110 150 L160 96 L240 160Z" fill="#B8C7F0" opacity=".55"/>
        <g class="sp-stairs" stroke-linejoin="round"><path class="spt-side" d="M50 64L56 60V160L50 160Z"/><path class="spt-top" d="M20 64L26 60H56L50 64Z"/><rect class="spt-front" x="20" y="64" width="30" height="96"/><path class="spt-bevel" d="M20.5 64.7H49.5"/><path class="spt-side" d="M80 80L86 76V160L80 160Z"/><path class="spt-top" d="M50 80L56 76H86L80 80Z"/><rect class="spt-front" x="50" y="80" width="30" height="80"/><path class="spt-bevel" d="M50.5 80.7H79.5"/><path class="spt-side" d="M110 96L116 92V160L110 160Z"/><path class="spt-top" d="M80 96L86 92H116L110 96Z"/><rect class="spt-front" x="80" y="96" width="30" height="64"/><path class="spt-bevel" d="M80.5 96.7H109.5"/><path class="spt-side" d="M140 112L146 108V160L140 160Z"/><path class="spt-top" d="M110 112L116 108H146L140 112Z"/><rect class="spt-front" x="110" y="112" width="30" height="48"/><path class="spt-bevel" d="M110.5 112.7H139.5"/><path class="spt-side" d="M170 128L176 124V160L170 160Z"/><path class="spt-top" d="M140 128L146 124H176L170 128Z"/><rect class="spt-front" x="140" y="128" width="30" height="32"/><path class="spt-bevel" d="M140.5 128.7H169.5"/><path class="spt-side" d="M200 144L206 140V160L200 160Z"/><path class="spt-top" d="M170 144L176 140H206L200 144Z"/><rect class="spt-front" x="170" y="144" width="30" height="16"/><path class="spt-bevel" d="M170.5 144.7H199.5"/></g>
        <rect class="sp-grass" y="158" width="240" height="22" fill="#8ED48A"/><rect class="sp-grass-top" y="158" width="240" height="4" fill="#B7EBA6"/>
        <g class="sp-crown"><path d="M22 58l-3-14 9 7 7-11 7 11 9-7-3 14z" fill="#FFC21A" stroke="#E08A00" stroke-width="1.6" stroke-linejoin="round"/><circle cx="35" cy="51" r="2.2" fill="#FF2D55"/></g>
        <g class="sp-hero">
          <g transform="scale(.21) translate(-60 -118)">
            <g fill="#3B274E"><ellipse cx="60" cy="119" rx="30" ry="5" opacity=".10"/><ellipse cx="60" cy="118" rx="19" ry="2.5" opacity=".18"/></g>
            <path d="M38 49 31 14 51 43Z M69 43 89 14 82 49Z" fill="#F2C55E"/>
            <g fill="#713AA7"><ellipse cx="46" cy="112" rx="12" ry="6"/><ellipse cx="74" cy="112" rx="12" ry="6"/></g>
            <g fill="#AC60E2"><ellipse cx="25" cy="84" rx="7" ry="11" transform="rotate(12 25 84)"/><ellipse cx="95" cy="84" rx="7" ry="11" transform="rotate(-12 95 84)"/></g>
            <ellipse cx="60" cy="78" rx="34" ry="37" fill="url(#spBody)"/>
            <path d="M35 62C38 48 49 43 61 45" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".24"/>
            <g fill="#FFFEFA"><ellipse cx="48" cy="68" rx="10" ry="12"/><ellipse cx="72" cy="68" rx="10" ry="12"/></g>
            <g fill="#30203F"><circle cx="50" cy="70" r="4.5"/><circle cx="74" cy="70" r="4.5"/><path d="M47 87Q60 92 73 87Q60 108 47 87Z"/></g>
            <g fill="#F385CD" opacity=".55"><ellipse cx="37" cy="83" rx="5" ry="3.5"/><ellipse cx="83" cy="83" rx="5" ry="3.5"/></g>
          </g>
        </g>
      </svg>
    </div>
    <h1><bdi dir="ltr">The Road To 100</bdi></h1>
    <p class="sp-sub">ציציפלצת בדרך לפסגה</p>
    <div class="sp-bar"><i></i></div>
    <div class="sp-cap" data-splash-cap>מכינים את המסלול שלך…</div>
  </div>
  <main id="stack" class="stack" aria-live="polite"></main>
  <div id="overlay-root"></div>
  <noscript>צריך JavaScript כדי לשחק.</noscript>
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>

  <script src="js/art.js"></script>
  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>

</body>
</html>
